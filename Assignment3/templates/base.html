<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Ocean Quiz{% endblock %}</title>

  <!-- Google Fonts: Playfair Display (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Ocean design tokens ── */
    :root {
      --bg:        #020d1a;
      --surface:   #051829;
      --border:    #0d2e47;
      --accent:    #00d4ff;
      --accent2:   #0077aa;
      --text:      #d6eef8;
      --muted:     #4a7a99;
      --correct:   #34d399;
      --incorrect: #f87171;
      --radius:    12px;
      --font-head: 'Playfair Display', serif;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      /* subtle radial glow from the top to mimic light filtering through water */
      background-image: radial-gradient(ellipse at 50% 0%, #052e52 0%, #020d1a 65%);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Animated bubbles in the background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(0,212,255,0.06) 1px, transparent 1px),
        radial-gradient(circle, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px, 30px 30px;
      background-position: 0 0, 15px 15px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Nav bar ── */
    nav {
      width: 100%;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 24, 41, 0.85);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 10;
    }

    nav .logo {
      font-family: var(--font-head);
      font-size: 1.2rem;
      color: var(--accent);
      letter-spacing: 0.03em;
      text-decoration: none;
      text-shadow: 0 0 18px rgba(0,212,255,0.4);
    }

    nav .nav-links a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav .nav-links a:hover { color: var(--accent); }

    /* ── Main content wrapper ── */
    main {
      width: 100%;
      max-width: 720px;
      padding: 3rem 1.5rem;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* ── Card ── */
    .card {
      background: rgba(5, 24, 41, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2.5rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(0,212,255,0.07);
    }

    /* ── Typography helpers ── */
    h1 { font-family: var(--font-head); font-size: 2.2rem; line-height: 1.15; }
    h2 { font-family: var(--font-head); font-size: 1.5rem; }
    h3 { font-family: var(--font-head); font-size: 1.1rem; }
    p  { line-height: 1.65; color: var(--muted); }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.7rem 1.6rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      text-decoration: none;
    }
    .btn:hover  { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 0 16px rgba(0,212,255,0.25); }
    .btn:active { transform: translateY(0); }

    .btn-primary   { background: var(--accent); color: #020d1a; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline   { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

    /* ── Error / info banners ── */
    .alert {
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }
    .alert-error { background: rgba(248,113,113,0.15); border: 1px solid var(--incorrect); color: var(--incorrect); }
    .alert-info  { background: rgba(0,212,255,0.08);   border: 1px solid var(--accent);    color: var(--accent); }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 1.8rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(0,212,255,0.5);
    }

    /* ── Fade in animation ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.35s ease both; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="logo" href="{{ url_for('home') }}">🐠 Fish Quiz</a>
    <div class="nav-links">
      {% if session.get('username') %}
        <a href="{{ url_for('logout') }}">Logout</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
